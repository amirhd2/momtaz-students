name: Deploy to GitHub Pages

# نسخه مرورگری برنامه (تمام دیتا در IndexedDB مرورگر) روی گیت‌هاب پیجز منتشر می‌شود.
# هر push به main = انتشار خودکار نسخه جدید.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Remove server API (static edition runs entirely in the browser)
        run: rm -rf src/app/api

      - name: Build static site
        run: npx next build
        env:
          NEXT_PUBLIC_DATA_MODE: local
          NEXT_PUBLIC_SUBPATH: /momtaz-students

      - name: Add .nojekyll (serve _next assets as-is)
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
